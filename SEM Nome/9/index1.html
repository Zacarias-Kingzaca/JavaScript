<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora</title>
    <style>
        body {
            background-color: antiquewhite;
            font-family: Arial, Helvetica, sans-serif;
        }

        button {
            background-color: azure;
            border: 1px solid #ccc;
            padding: 10px 25px;
            font-weight:bold;
            border-radius: 4px;
        }

        button:hover {
            background-color: aliceblue;
            cursor: pointer;
        }

        input {
            padding: 10px;
            margin: 20px;
        }

        #tabuada {
            background-color: white;
            width: 400px;
            min-height: 300px;
            margin: 20px;
            display: none;
            padding: 15px;
        }
    </style>
</head>
<body>
    <input type="number" name="number" id="number">
    <button id="gerar">Gerar</button>
    <div>
        <div id="tabuada">

        </div>
    </div>
    
    <script>
         let number = document.getElementById("number")
         let btn = document.getElementById("gerar")
         let tabuada =  document.getElementById("tabuada")

         btn.addEventListener("click", function() {
            if (number.value) {
                num = number.value
                number.value = ""
                tabuada.style.display = "block"
                for(let i = 1; i < 13; i++) {
                    tabuada.innerHTML += ` ${num} x ${i} = ${num * i} <br>`           
                }
            }else{
                alert("Impute vazio, digit um número para continuar.")
            }

         })
    </script>
</body>
</html>
