<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <div id="status" class="erro">Falhou</div>
    <script>
        const status = document.getElementById("status")
        if (status.classList.contains('erro')) {
            status.classList.replace("erro", "sucesso")
            status.textContent = "Deu certo"
        }
    </script>
</body>
</html>
